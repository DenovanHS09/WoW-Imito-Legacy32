
name: VirGL ARM32 Java Initialization Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Legacy32 repository
        uses: actions/checkout@v4
        with:
          ref: legacy32-dev

      - name: Checkout Winlator Java and native source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: upstream
          sparse-checkout: |
            app/src/main/java
            app/src/main/cpp/winlator
          sparse-checkout-cone-mode: true

      - name: Prepare audit directory
        run: mkdir -p build/java-init-audit

      - name: Audit Java initialization and library loading
        shell: bash
        run: |
          set -e

          REPORT="build/java-init-audit/java-initialization-report.txt"
          JAVA_DIR="upstream/app/src/main/java"
          CPP_DIR="upstream/app/src/main/cpp/winlator"

          {
            echo "=== VIRGL ARM32 JAVA INITIALIZATION AUDIT ==="
            echo "Repository: brunodev85/winlator-app"
            echo "Branch: main"
            echo

            echo "=== 1. GPUHelper_setGlobalEGLContext REFERENCES ==="
            grep -Rni -C 10 \
              --include='*.java' --include='*.kt' \
              --include='*.c' --include='*.h' \
              'setGlobalEGLContext' \
              "$JAVA_DIR" "$CPP_DIR" || true

            echo
            echo "=== 2. VirGLRendererComponent REFERENCES ==="
            grep -Rni -C 10 \
              --include='*.java' --include='*.kt' \
              'VirGLRendererComponent' \
              "$JAVA_DIR" || true

            echo
            echo "=== 3. NATIVE LIBRARY LOADING ORDER ==="
            grep -Rni -C 5 \
              --include='*.java' --include='*.kt' \
              'System.loadLibrary' \
              "$JAVA_DIR" || true

            echo
            echo "=== 4. GPU HELPER JAVA DECLARATIONS ==="
            grep -Rni -C 8 \
              --include='*.java' --include='*.kt' \
              'GPUHelper' \
              "$JAVA_DIR" || true

            echo
            echo "=== 5. NATIVE GPU HELPER IMPLEMENTATION ==="
            grep -Rni -C 10 \
              'GPUHelper_setGlobalEGLContext' \
              "$CPP_DIR" || true

            echo
            echo "=== 6. EGL CONTEXT INITIALIZATION CALLS ==="
            grep -Rni -C 5 \
              --include='*.java' --include='*.kt' \
              -E 'eglCreateContext|eglMakeCurrent|EGLContext|initialize.*GPU|initialize.*Renderer' \
              "$JAVA_DIR" || true

            echo
            echo "=== 7. VIRGL COMPONENT STARTUP AND CONSTRUCTION ==="
            grep -Rni -C 8 \
              --include='*.java' --include='*.kt' \
              -E 'new VirGLRendererComponent|\.start\(\)|VirGLRendererComponent\(' \
              "$JAVA_DIR" || true

            echo
            echo "=== AUDIT FINISHED ==="
          } > "$REPORT"

          cat "$REPORT"

      - name: Upload Java initialization audit
        uses: actions/upload-artifact@v4
        with:
          name: virgl-arm32-java-init-audit
          path: build/java-init-audit/
          if-no-files-found: error
          
