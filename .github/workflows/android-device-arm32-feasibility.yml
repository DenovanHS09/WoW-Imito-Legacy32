
name: Android ARM32 Feasibility Check

on:
  workflow_dispatch:

  push:
    branches:
      - legacy32-dev
    paths:
      - '.github/workflows/android-device-arm32-feasibility.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Android ABI references
        shell: bash
        run: |
          echo "=== ANDROID ABI FEASIBILITY ==="

          echo ""
          echo "=== REPOSITORY ABI CONFIGURATION ==="

          grep -RniE \
            'armeabi-v7a|arm64-v8a|abiFilters|ANDROID_ABI|CMAKE_ANDROID_ARCH_ABI' \
            --exclude-dir=.git \
            --exclude='android-device-arm32-feasibility.yml' \
            . || true

          echo ""
          echo "=== NATIVE BUILD SYSTEMS ==="

          find . -type f \( \
            -name 'CMakeLists.txt' \
            -o -name 'Android.mk' \
            -o -name 'Application.mk' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
          \) -not -path './.git/*' -print

          echo ""
          echo "=== HOST BUILD ENVIRONMENT ==="

          uname -m
          getconf LONG_BIT

          echo ""
          echo "=== ARM32 TOOLCHAIN AVAILABILITY ==="

          for tool in arm-linux-gnueabihf-gcc \
                      arm-linux-gnueabihf-g++ \
                      arm-linux-gnueabi-gcc \
                      aarch64-linux-gnu-gcc; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "[FOUND] $tool"
            else
              echo "[NOT FOUND] $tool"
            fi
          done

          echo ""
          echo "=== ANDROID NDK REFERENCES ==="

          find . -type f \( \
            -name 'source.properties' \
            -o -name 'Application.mk' \
          \) -not -path './.git/*' -print

          echo ""
          echo "=== END OF FEASIBILITY CHECK ==="
          
