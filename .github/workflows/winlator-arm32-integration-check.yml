
name: Winlator ARM32 Integration Check

on:
  workflow_dispatch:
  push:
    branches:
      - legacy32-dev
    paths:
      - '.github/workflows/winlator-arm32-integration-check.yml'
      - 'patches/**'
      - 'docs/**'
      - 'README*'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Winlator integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository structure
        run: |
          echo "=== REPOSITORY ROOT ==="
          ls -la

          echo ""
          echo "=== PROJECT DIRECTORIES ==="

          find . -maxdepth 4 -type d \
            -not -path './.git*' \
            | sort | head -250

      - name: Search Android and native build files
        run: |
          python3 - <<'PY'
          import os

          extensions = (
              "CMakeLists.txt",
              "Android.mk",
              "Application.mk",
              "build.gradle",
              "build.gradle.kts",
              "settings.gradle",
              "settings.gradle.kts",
              "gradlew",
              "Cargo.toml"
          )

          print("=== ANDROID / NATIVE BUILD FILES ===")

          found = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in (".git", ".gradle", "build")
              ]

              for name in files:
                  if name in extensions:
                      path = os.path.join(root, name)
                      print(path)
                      found += 1

          print("\nTotal build files:", found)

          if found == 0:
              print("No Android/native build files found.")
          PY

      - name: Inspect Winlator references in repository
        run: |
          python3 - <<'PY'
          import os

          terms = (
              "winlator",
              "box86",
              "box64",
              "wine",
              "virgl",
              "armeabi-v7a",
              "arm64-v8a",
              "ANDROID_ABI",
              "CMAKE_ANDROID_ARCH_ABI"
          )

          extensions = (
              ".md", ".txt", ".yml", ".yaml",
              ".gradle", ".kts", ".cmake",
              ".mk", ".sh", ".json", ".properties"
          )

          print("=== WINLATOR AND ARCHITECTURE REFERENCES ===")

          total = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in (".git", ".gradle", "build")
              ]

              for name in files:
                  if not name.lower().endswith(extensions):
                      continue

                  path = os.path.join(root, name)

                  try:
                      with open(path, encoding="utf-8",
                                errors="replace") as f:
                          lines = f.readlines()

                      hits = [
                          (i, line.strip())
                          for i, line in enumerate(lines, 1)
                          if any(t in line.lower() for t in terms)
                      ]

                      if hits:
                          print(f"\n--- {path} ---")

                          for number, line in hits[:25]:
                              print(f"{number}: {line[:220]}")
                              total += 1

                  except Exception:
                      pass

          print("\nTotal matching lines:", total)
          PY

      - name: Inspect patch inventory
        run: |
          echo "=== PATCH FILE INVENTORY ==="

          find patches -maxdepth 5 -type f \
            -printf '%p (%s bytes)\n' \
            2>/dev/null | sort || true

      - name: Inspect archive contents
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          print("=== ARCHIVE INVENTORY ===")

          archives = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in (".git", ".gradle", "build")
              ]

              for name in files:
                  if name.lower().endswith(
                      (".zip", ".aar", ".jar", ".apk")
                  ):
                      archives.append(os.path.join(root, name))

          if not archives:
              print("No ZIP/AAR/JAR/APK archives found.")

          for path in archives:
              print(f"\n--- {path} ---")

              if path.lower().endswith(".zip"):
                  try:
                      with zipfile.ZipFile(path) as archive:
                          names = archive.namelist()

                          print("Entries:", len(names))

                          matches = [
                              n for n in names
                              if any(term in n.lower() for term in (
                                  "winlator",
                                  "armeabi-v7a",
                                  "arm64-v8a",
                                  "jni/",
                                  "libwinlator",
                                  "cmake"
                              ))
                          ]

                          for name in matches[:60]:
                              print(name)

                  except Exception as error:
                      print("Archive inspection error:", error)
          PY

      - name: Check available Android ABI configuration
        run: |
          echo "=== ANDROID ABI CONFIGURATION ==="

          grep -RniE \
            'armeabi-v7a|arm64-v8a|ANDROID_ABI|CMAKE_ANDROID_ARCH_ABI|abiFilters' \
            . \
            --exclude-dir=.git \
            --exclude='*.zip' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            2>/dev/null | head -150 || true

      - name: Final report
        run: |
          echo "========================================"
          echo "WINLATOR ARM32 INTEGRATION AUDIT"
          echo "========================================"
          echo "Repository inspection completed."
          echo "No files were modified by this audit."
          
