
name: VirGL ARM32 Build Probe

on:
  workflow_dispatch:
  push:
    branches:
      - legacy32-dev
    paths:
      - 'patches/virgl/virgl-imito-1.5.7-source.zip'
      - '.github/workflows/virgl-arm32-build-probe.yml'

jobs:
  arm32-build:
    name: Test VirGL for armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          set -e
          test -f patches/virgl/virgl-imito-1.5.7-source.zip

          mkdir -p build/virgl-source

          unzip -q patches/virgl/virgl-imito-1.5.7-source.zip \
            -d build/virgl-source

          test -f build/virgl-source/cpp/virglrenderer/CMakeLists.txt

          echo "VirGL source archive found."
          echo "Source directory:"

          find build/virgl-source -maxdepth 3 -type f | head -40

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip

      - name: Install Android SDK command-line tools
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -n "$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          test -f "$SDKMANAGER"

          echo "Android SDK command-line tools verified."

      - name: Install Android NDK
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          echo "=== INSTALLED SDK PACKAGES ==="
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --list_installed

          echo "=== INSTALLING NDK ==="
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          test -f "$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

          echo "NDK installation verified."

      - name: Inspect ARM32 dependencies
        run: |
          echo "=== VIRGL CMAKE CONFIGURATION ==="

          sed -n '1,180p' build/virgl-source/cpp/virglrenderer/CMakeLists.txt

          echo "=== JNI AND GRAPHICS DEPENDENCIES ==="

          grep -RniE 'winlator\.h|winlator|jni\.h|EGL|GLES' \
            build/virgl-source/cpp | head -100 || true

          echo "=== ARCHITECTURE REFERENCES ==="

          grep -RniE '__arm__|__aarch64__|armv7|aarch64' \
            build/virgl-source/cpp | head -80 || true

      - name: Configure VirGL for ARM32
        id: configure
        continue-on-error: true
        run: |
          set -o pipefail

          cmake -S build/virgl-source/cpp/virglrenderer \
            -B build/virgl-arm32 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee build/configure.log

      - name: Compile VirGL ARM32
        id: compile
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail

          cmake --build build/virgl-arm32 --parallel 2 \
            2>&1 | tee build/compile.log

      - name: Report results
        if: always()
        run: |
          echo "=== VIRGL ARM32 BUILD PROBE ==="
          echo "Target ABI: armeabi-v7a"
          echo "Target OS: Android"
          echo "NDK: 27.2.12479018"

          echo "=== NDK STATUS ==="

          if [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
            echo "NDK installed and verified."
          else
            echo "NDK installation not verified."
          fi

          echo "=== CONFIGURATION ==="

          if [ -f build/configure.log ]; then
            tail -60 build/configure.log
          else
            echo "Configuration did not produce a log."
          fi

          echo "=== COMPILATION ==="

          if [ -f build/compile.log ]; then
            tail -80 build/compile.log
          else
            echo "Compilation was not reached."
          fi

          echo "=== GENERATED LIBRARIES ==="

          find build/virgl-arm32 -type f \
            \( -name '*.so' -o -name '*.a' \) 2>/dev/null || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virgl-arm32-build-report
          path: |
            build/configure.log
            build/compile.log
          if-no-files-found: ignore
          
