
name: VirGL ARM32 Runtime Audit

on:
  push:
    branches:
      - 'legacy32-dev'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    name: Audit ARM32 Native Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Legacy32 repository
        uses: actions/checkout@v4

      - name: Checkout Winlator upstream source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: build/winlator-upstream
          fetch-depth: 1
          sparse-checkout: |
            app/src/main/cpp/winlator
            app/src/main/java
          sparse-checkout-cone-mode: true

      - name: Prepare VirGL source
        run: |
          set -e
          mkdir -p build/virgl-source

          unzip -q patches/virgl/virgl-imito-1.5.7-source.zip \
            -d build/virgl-source

          test -d build/virgl-source/cpp/virglrenderer

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip file

      - name: Locate Android NDK
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -1)"

          test -n "$SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

      - name: Rebuild ARM32 libraries
        run: |
          set -e

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"

          TIME_HEADER="$WINLATOR/include/time_utils.h"
          STRING_HEADER="$WINLATOR/include/string_utils.h"

          python3 - "$TIME_HEADER" "$STRING_HEADER" <<'PY'
          import pathlib
          import re
          import sys

          def add_include(path, header):
              path = pathlib.Path(path)
              content = path.read_text()

              pattern = (
                  r'^\s*#\s*include\s*[<"]'
                  + re.escape(header)
                  + r'[>"]'
              )

              if re.search(pattern, content, re.M):
                  return

              lines = content.splitlines(keepends=True)

              positions = [
                  i for i, line in enumerate(lines)
                  if re.match(r'^\s*#\s*include\b', line)
              ]

              index = positions[-1] + 1 if positions else 0
              lines.insert(index, f"#include <{header}>\n")
              path.write_text("".join(lines))

          add_include(sys.argv[1], "time.h")
          add_include(sys.argv[2], "string.h")
          add_include(sys.argv[2], "stdlib.h")
          PY

          mkdir -p build/integration

          cat > build/integration/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(Legacy32VirGLIntegration C CXX)

          add_subdirectory(
            "${CMAKE_CURRENT_LIST_DIR}/../winlator-upstream/app/src/main/cpp/winlator"
            winlator
          )

          add_subdirectory(
            "${CMAKE_CURRENT_LIST_DIR}/../virgl-source/cpp/virglrenderer"
            virglrenderer
          )
          EOF

          cmake -S build/integration \
            -B build/virgl-arm32-integrated \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_C_FLAGS="-D_POSIX_C_SOURCE=200809L" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build/virgl-arm32-integrated --parallel 2

      - name: Inspect ELF architecture and dependencies
        run: |
          set -e

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p build/runtime-audit

          for LIB in \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so
          do
            test -f "$LIB"

            NAME="$(basename "$LIB")"

            file "$LIB"

            "$READELF" -h "$LIB" \
              > "build/runtime-audit/$NAME.elf-header.txt"

            "$READELF" -d "$LIB" \
              > "build/runtime-audit/$NAME.dynamic.txt"

            "$READELF" --dyn-syms --wide "$LIB" \
              > "build/runtime-audit/$NAME.symbols.txt"

            echo "=== $NAME ELF HEADER ==="

            grep -E 'Class:|Machine:|OS/ABI:|ABI Version:' \
              "build/runtime-audit/$NAME.elf-header.txt"

            echo "=== $NAME DT_NEEDED ==="

            grep 'NEEDED' "build/runtime-audit/$NAME.dynamic.txt" || true

            echo "=== $NAME UNDEFINED SYMBOLS ==="

            grep ' UND ' "build/runtime-audit/$NAME.symbols.txt" || true

            echo "=== $NAME JNI EXPORTS ==="

            grep 'Java_' "build/runtime-audit/$NAME.symbols.txt" || true
          done

      - name: Audit EGL and GLES references
        run: |
          set -e

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          for LIB in \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so
          do
            echo "=== GRAPHICS REFERENCES: $(basename "$LIB") ==="

            "$READELF" --dyn-syms --wide "$LIB" \
              | grep -E 'egl[A-Z]|gl[A-Z]' || true
          done

          grep -RhoE '\b(gl|egl)[A-Z][A-Za-z0-9_]+' \
            build/virgl-source/cpp/virglrenderer \
            | sort -u \
            > build/runtime-audit/virgl-graphics-api.txt

          cat build/runtime-audit/virgl-graphics-api.txt

      - name: Audit JNI exports in source
        run: |
          set -e

          mkdir -p build/runtime-audit

          grep -RInE 'JNIEXPORT|Java_com_winlator' \
            build/winlator-upstream/app/src/main/cpp/winlator \
            > build/runtime-audit/winlator-jni-source.txt || true

          grep -RInE 'JNIEXPORT|Java_com_winlator' \
            build/virgl-source/cpp/virglrenderer \
            > build/runtime-audit/virgl-jni-source.txt || true

          echo "=== WINLATOR JNI ==="
          cat build/runtime-audit/winlator-jni-source.txt

          echo "=== VIRGL JNI ==="
          cat build/runtime-audit/virgl-jni-source.txt

      - name: Audit EGL context ownership and JNI implementation
        run: |
          set -e

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p build/runtime-audit

          grep -RIn "globalEGLContext" "$WINLATOR" "$VIRGL" \
            > build/runtime-audit/global-egl-context-source.txt || true

          grep -RIn "getCurrentEGLContextPtr" "$WINLATOR" "$VIRGL" \
            > build/runtime-audit/current-egl-context-source.txt || true

          "$READELF" --dyn-syms --wide \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            | grep -w "globalEGLContext" \
            > build/runtime-audit/global-egl-context-winlator-symbol.txt || true

          "$READELF" --dyn-syms --wide \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so \
            | grep -E "globalEGLContext|getCurrentEGLContextPtr" \
            > build/runtime-audit/global-egl-context-virgl-symbol.txt || true

          echo "=== SOURCE REFERENCES ==="
          cat build/runtime-audit/global-egl-context-source.txt
          cat build/runtime-audit/current-egl-context-source.txt

          echo "=== WINLATOR DYNAMIC SYMBOL ==="
          cat build/runtime-audit/global-egl-context-winlator-symbol.txt

          echo "=== VIRGL DYNAMIC SYMBOL ==="
          cat build/runtime-audit/global-egl-context-virgl-symbol.txt

      - name: Audit EGL Context Initialization Order
        run: |
          set -e

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          WINLATOR_JAVA="build/winlator-upstream/app/src/main/java"
          LOCAL_JAVA="app/src/main/java"

          OUT="build/runtime-audit/egl-order-audit.txt"

          mkdir -p build/runtime-audit
          : > "$OUT"

          echo "=== GPU HELPER EGL IMPLEMENTATION ===" >> "$OUT"

          grep -RIn -C 20 -E \
            'globalEGLContext|eglGetCurrentContext|eglCreateContext|setGlobalEGLContext|createOffscreenEGLContext' \
            "$WINLATOR" >> "$OUT" 2>/dev/null || true

          echo "=== VIRGL EGL CONTEXT CREATION ===" >> "$OUT"

          grep -RIn -C 20 -E \
            'eglCreateContext|globalEGLContext|eglMakeCurrent|eglDestroyContext' \
            "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== VIRGL JNI CONTEXT IMPLEMENTATION ===" >> "$OUT"

          grep -RIn -C 20 -E \
            'getCurrentEGLContextPtr|handleNewConnection|handleRequest|destroyRenderer' \
            "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== JAVA EGL AND VIRGL CALL SITES ===" >> "$OUT"

          for JAVA_DIR in "$LOCAL_JAVA" "$WINLATOR_JAVA"; do
            if [ -d "$JAVA_DIR" ]; then
              echo "--- SEARCHING $JAVA_DIR ---" >> "$OUT"

              grep -RIn -C 8 -E \
                'setGlobalEGLContext|createOffscreenEGLContext|getCurrentEGLContextPtr|handleNewConnection|VirGLRendererComponent|startEnvironmentComponents|onSurfaceCreated|eglMakeCurrent' \
                "$JAVA_DIR" >> "$OUT" 2>/dev/null || true
            fi
          done

          echo "=== AUDIT COMPLETE ===" >> "$OUT"

          cat "$OUT"

      - name: Audit EGL Config and Thread Safety
        shell: bash
        run: |
          set -e

          WIN="build/winlator-upstream/app/src/main"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          WIN_JAVA="build/winlator-upstream/app/src/main/java"
          LOCAL_JAVA="app/src/main/java"

          OUT="build/runtime-audit/egl-config-thread-audit.txt"

          mkdir -p build/runtime-audit
          : > "$OUT"

          echo "=== 1. WINLATOR EGL CONFIGURATION ===" >> "$OUT"

          grep -RIn -C 12 -E \
            'EGL_ALPHA_SIZE|EGL_RED_SIZE|EGL_GREEN_SIZE|EGL_BLUE_SIZE|EGL_RENDERABLE_TYPE|EGL_SURFACE_TYPE|setEGLConfigChooser|eglChooseConfig|setEGLContextClientVersion|EGLConfigChooser' \
            "$WIN" >> "$OUT" 2>/dev/null || true

          echo "=== 2. VIRGL EGL CONFIGURATION ===" >> "$OUT"

          grep -RIn -C 15 -E \
            'EGL_ALPHA_SIZE|EGL_RED_SIZE|EGL_GREEN_SIZE|EGL_BLUE_SIZE|EGL_RENDERABLE_TYPE|EGL_SURFACE_TYPE|eglChooseConfig|eglCreateContext|eglBindAPI' \
            "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== 3. VIRGL EGL INITIALIZATION CALLERS ===" >> "$OUT"

          grep -RIn -C 12 -E \
            'virgl_server_egl_init|virgl_server_renderer_init|egl_init|renderer_init' \
            "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== 4. GLOBAL EGL CONTEXT ACCESS ===" >> "$OUT"

          grep -RIn -C 8 'globalEGLContext' \
            build/winlator-upstream/app/src/main/cpp \
            "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== 5. THREAD SYNCHRONIZATION ===" >> "$OUT"

          grep -RIn -C 5 -E \
            'pthread_mutex|pthread_rwlock|std::mutex|synchronized|AtomicReference|volatile|HandlerThread|runOnUiThread|queueEvent|eglMakeCurrent' \
            "$WIN" "$VIRGL" \
            >> "$OUT" 2>/dev/null || true

          echo "=== 6. VIRGL JAVA STARTUP ===" >> "$OUT"

          for DIR in "$LOCAL_JAVA" "$WIN_JAVA"; do
            if [ -d "$DIR" ]; then
              grep -RIn -C 15 -E \
                'class VirGLRendererComponent|handleNewConnection|handleRequest|getCurrentEGLContextPtr|start\(\)|new Thread|Thread\(' \
                "$DIR" >> "$OUT" 2>/dev/null || true
            fi
          done

          echo "=== 7. EGL ERROR HANDLING ===" >> "$OUT"

          grep -RIn -C 5 -E \
            'eglGetError|EGL_BAD_MATCH|EGL_BAD_CONTEXT|EGL_BAD_DISPLAY|EGL_NO_CONTEXT|EGL_CONTEXT_CLIENT_VERSION' \
            "$WIN" "$VIRGL" >> "$OUT" 2>/dev/null || true

          echo "=== AUDIT COMPLETE ===" >> "$OUT"

          cat "$OUT"

      - name: Generate runtime audit summary
        if: always()
        run: |
          mkdir -p build/runtime-audit

          {
            echo "=== VIRGL ARM32 RUNTIME AUDIT ==="
            echo "Target ABI: armeabi-v7a"
            echo "Android API: 26"
            echo "NDK: 27.2.12479018"

            echo "=== LIBRARIES ==="

            find build/virgl-arm32-integrated -type f \
              -name '*.so' 2>/dev/null || true

            echo "=== AUDIT FILES ==="

            find build/runtime-audit -type f 2>/dev/null || true

          } | tee build/runtime-audit/summary.txt

      - name: Upload runtime audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virgl-arm32-runtime-audit
          path: build/runtime-audit/
          if-no-files-found: warn
          
