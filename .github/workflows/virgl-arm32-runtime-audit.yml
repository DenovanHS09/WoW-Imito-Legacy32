
name: VirGL ARM32 Runtime Audit

on:
  push:
    branches:
      - 'legacy32-dev'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    name: Audit ARM32 Native Libraries
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout Legacy32 repository
        uses: actions/checkout@v4

      - name: Checkout Winlator upstream source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: build/winlator-upstream
          fetch-depth: 1
          sparse-checkout: |
            app/src/main/cpp/winlator
            app/src/main/java
          sparse-checkout-cone-mode: true

      # --------------------------------------------------
      # 2. PREPARE VIRGL SOURCE
      # --------------------------------------------------

      - name: Prepare VirGL source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/virgl-source

          unzip -q patches/virgl/virgl-imito-1.5.7-source.zip \
            -d build/virgl-source

          test -d build/virgl-source/cpp/virglrenderer

          echo "VirGL source extracted successfully."

      # --------------------------------------------------
      # 3. INSTALL TOOLS AND NDK
      # --------------------------------------------------

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip file

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -1)"

          test -n "$SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. PREPARE HEADERS
      # --------------------------------------------------

      - name: Prepare Winlator headers
        shell: bash
        run: |
          set -euo pipefail

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"

          test -d "$WINLATOR"

          python3 - "$WINLATOR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])

          required = {
              "time_utils.h": ["time.h"],
              "string_utils.h": ["string.h", "stdlib.h"],
          }

          for filename, headers in required.items():
              matches = list(root.rglob(filename))

              if not matches:
                  raise SystemExit(f"Missing header: {filename}")

              for path in matches:
                  content = path.read_text()

                  for header in headers:
                      pattern = (
                          r'^\s*#\s*include\s*[<"]'
                          + re.escape(header)
                          + r'[>"]'
                      )

                      if re.search(pattern, content, re.M):
                          continue

                      lines = content.splitlines(keepends=True)

                      positions = [
                          i for i, line in enumerate(lines)
                          if re.match(r'^\s*#\s*include\b', line)
                      ]

                      index = positions[-1] + 1 if positions else 0

                      lines.insert(index, f"#include <{header}>\n")
                      content = "".join(lines)

                  path.write_text(content)
                  print(f"Verified: {path}")
          PY

      # --------------------------------------------------
      # 5. BUILD ARM32
      # --------------------------------------------------

      - name: Build Winlator and VirGL ARM32
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/integration

          cat > build/integration/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(Legacy32VirGLIntegration C CXX)

          add_subdirectory(
            "${CMAKE_CURRENT_LIST_DIR}/../winlator-upstream/app/src/main/cpp/winlator"
            winlator
          )

          add_subdirectory(
            "${CMAKE_CURRENT_LIST_DIR}/../virgl-source/cpp/virglrenderer"
            virglrenderer
          )
          EOF

          cmake -S build/integration \
            -B build/virgl-arm32-integrated \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_C_FLAGS="-D_POSIX_C_SOURCE=200809L" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build/virgl-arm32-integrated --parallel 2

          test -f build/virgl-arm32-integrated/winlator/libwinlator.so
          test -f build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so

      # --------------------------------------------------
      # 6. ELF AUDIT
      # --------------------------------------------------

      - name: Inspect ELF architecture and dependencies
        shell: bash
        run: |
          set -euo pipefail

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p build/runtime-audit

          for LIB in \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so
          do
            test -f "$LIB"

            NAME="$(basename "$LIB")"

            file "$LIB"

            "$READELF" -h "$LIB" \
              > "build/runtime-audit/$NAME.elf-header.txt"

            "$READELF" -d "$LIB" \
              > "build/runtime-audit/$NAME.dynamic.txt"

            "$READELF" --dyn-syms --wide "$LIB" \
              > "build/runtime-audit/$NAME.symbols.txt"

            echo "=== $NAME ELF HEADER ==="

            grep -E 'Class:|Machine:|OS/ABI:|ABI Version:' \
              "build/runtime-audit/$NAME.elf-header.txt"

            echo "=== $NAME DT_NEEDED ==="

            grep 'NEEDED' \
              "build/runtime-audit/$NAME.dynamic.txt" || true

            echo "=== $NAME JNI EXPORTS ==="

            grep 'Java_' \
              "build/runtime-audit/$NAME.symbols.txt" || true
          done

      # --------------------------------------------------
      # 7. GRAPHICS API AUDIT
      # --------------------------------------------------

      - name: Audit EGL and GLES references
        shell: bash
        run: |
          set -euo pipefail

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          for LIB in \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so
          do
            echo "=== GRAPHICS REFERENCES: $(basename "$LIB") ==="

            "$READELF" --dyn-syms --wide "$LIB" \
              | grep -E 'egl[A-Z]|gl[A-Z]' || true
          done

          grep -RhoE '\b(gl|egl)[A-Z][A-Za-z0-9_]+' \
            build/virgl-source/cpp/virglrenderer \
            | sort -u \
            > build/runtime-audit/virgl-graphics-api.txt

      # --------------------------------------------------
      # 8. JNI SOURCE AUDIT
      # --------------------------------------------------

      - name: Audit JNI exports in source
        shell: bash
        run: |
          set -euo pipefail

          grep -RInE 'JNIEXPORT|Java_com_winlator' \
            build/winlator-upstream/app/src/main/cpp/winlator \
            > build/runtime-audit/winlator-jni-source.txt || true

          grep -RInE 'JNIEXPORT|Java_com_winlator' \
            build/virgl-source \
            > build/runtime-audit/virgl-jni-source.txt || true

          echo "=== WINLATOR JNI ==="
          cat build/runtime-audit/winlator-jni-source.txt

          echo "=== VIRGL JNI ==="
          cat build/runtime-audit/virgl-jni-source.txt

      # --------------------------------------------------
      # 9. GLOBAL EGL CONTEXT AUDIT
      # --------------------------------------------------

      - name: Audit EGL context ownership
        shell: bash
        run: |
          set -euo pipefail

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          grep -RIn "globalEGLContext" "$WINLATOR" "$VIRGL" \
            > build/runtime-audit/global-egl-context-source.txt || true

          grep -RIn "getCurrentEGLContextPtr" "$WINLATOR" "$VIRGL" \
            > build/runtime-audit/current-egl-context-source.txt || true

          "$READELF" --dyn-syms --wide \
            build/virgl-arm32-integrated/winlator/libwinlator.so \
            | grep -w "globalEGLContext" \
            > build/runtime-audit/global-egl-context-winlator-symbol.txt || true

          "$READELF" --dyn-syms --wide \
            build/virgl-arm32-integrated/virglrenderer/libvirglrenderer.so \
            | grep -E "globalEGLContext|getCurrentEGLContextPtr" \
            > build/runtime-audit/global-egl-context-virgl-symbol.txt || true

          echo "=== GLOBAL EGL REFERENCES ==="
          cat build/runtime-audit/global-egl-context-source.txt

          echo "=== CURRENT EGL CONTEXT REFERENCES ==="
          cat build/runtime-audit/current-egl-context-source.txt

      # --------------------------------------------------
      # 10. CONNECTOR / THREAD / VIEW LIFECYCLE
      # --------------------------------------------------

      - name: Audit Connector Thread and View Lifecycle
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/runtime-audit/connector-thread-lifecycle.txt"

          mkdir -p build/runtime-audit

          {
            echo "=== CONNECTOR / THREAD / VIEW LIFECYCLE ==="
            echo "Date: $(date -u)"
            echo

            echo "=== JAVA SOURCE FILE DISCOVERY ==="

            find build/winlator-upstream build/virgl-source \
              -type f \
              \( -name 'XConnectorEpoll.java' \
              -o -name 'VirGLRendererComponent.java' \
              -o -name 'XEnvironment.java' \
              -o -name 'XServerView.java' \
              -o -name 'GLRenderer.java' \
              -o -name 'XServerDisplayActivity.java' \) \
              -print | sort

            echo
            echo "=== FULL JAVA SOURCE FILES ==="

            while IFS= read -r -d '' FILE; do
              echo
              echo "=================================================="
              echo "FILE: $FILE"
              echo "=================================================="

              nl -ba "$FILE" | head -n 900

            done < <(
              find build/winlator-upstream build/virgl-source \
                -type f \
                \( -name 'XConnectorEpoll.java' \
                -o -name 'VirGLRendererComponent.java' \
                -o -name 'XEnvironment.java' \
                -o -name 'XServerView.java' \
                -o -name 'GLRenderer.java' \
                -o -name 'XServerDisplayActivity.java' \) \
                -print0 | sort -z
            )

            echo
            echo "=== LIFECYCLE AND THREAD REFERENCES ==="

            grep -RniE \
              'startEnvironmentComponents|VirGLRendererComponent|XConnectorEpoll|onSurfaceCreated|setGlobalEGLContext|handleNewConnection|new Thread|Thread\.start|ExecutorService|HandlerThread|CountDownLatch|synchronized|volatile|queueEvent|eglMakeCurrent|eglGetCurrentContext' \
              build/winlator-upstream/app/src/main/java \
              build/virgl-source/java \
              2>/dev/null || true

          } > "$OUT"

          echo "Generated: $OUT"
          echo "Lines: $(wc -l < "$OUT")"
          head -n 100 "$OUT"

      # --------------------------------------------------
      # 11. EGL INITIALIZATION ORDER
      # --------------------------------------------------

      - name: Audit EGL initialization order
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/runtime-audit/egl-order-audit.txt"

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          JAVA="build/winlator-upstream/app/src/main/java"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          {
            echo "=== EGL INITIALIZATION ORDER AUDIT ==="
            echo

            echo "=== GLOBAL EGL CONTEXT ==="

            grep -RniE \
              'globalEGLContext|setGlobalEGLContext|eglGetCurrentContext' \
              "$WINLATOR" "$JAVA" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=== EGL CONTEXT CREATION ==="

            grep -RniE \
              'eglCreateContext|eglMakeCurrent|eglDestroyContext' \
              "$WINLATOR" "$JAVA" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=== RENDERER INITIALIZATION ==="

            grep -RniE \
              'virgl_server_renderer_init|virgl_server_egl_init|vrend_renderer_init' \
              "$WINLATOR" "$JAVA" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=== SURFACE INITIALIZATION ==="

            grep -RniE \
              'onSurfaceCreated|onSurfaceChanged|setRenderer|GLSurfaceView' \
              "$JAVA" 2>/dev/null || true

          } > "$OUT"

          cat "$OUT"

      # --------------------------------------------------
      # 12. EGL CONFIGURATION AND THREAD SAFETY
      # --------------------------------------------------

      - name: Audit EGL config and thread safety
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/runtime-audit/egl-config-thread-audit.txt"

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          JAVA="build/winlator-upstream/app/src/main/java"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          {
            echo "=== EGL CONFIGURATION ==="

            grep -RniE \
              'EGL_SURFACE_TYPE|EGL_PBUFFER_BIT|EGL_WINDOW_BIT|EGL_RENDERABLE_TYPE|EGL_OPENGL_ES3_BIT|EGL_RED_SIZE|EGL_GREEN_SIZE|EGL_BLUE_SIZE|EGL_ALPHA_SIZE|EGL_CONTEXT_CLIENT_VERSION' \
              "$WINLATOR" "$JAVA" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=== EGL THREAD AND SYNCHRONIZATION ==="

            grep -RniE \
              'globalEGLContext|eglMakeCurrent|eglGetCurrentContext|synchronized|volatile|CountDownLatch|Semaphore|ReentrantLock|pthread_mutex|queueEvent|HandlerThread|ExecutorService|new Thread|Thread\.start' \
              "$WINLATOR" "$JAVA" "$VIRGL" \
              2>/dev/null || true

          } > "$OUT"

          cat "$OUT"

      # --------------------------------------------------
      # 13. NATIVE EPOLL AND EGL INITIALIZATION AUDIT
      # --------------------------------------------------

      - name: Audit Native Epoll and VirGL EGL Initialization
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/runtime-audit/native-epoll-egl-audit.txt"

          WINLATOR="build/winlator-upstream/app/src/main/cpp/winlator"
          VIRGL="build/virgl-source/cpp/virglrenderer"

          mkdir -p build/runtime-audit

          {
            echo "=== NATIVE EPOLL AND EGL AUDIT ==="
            echo "Date: $(date -u)"
            echo

            echo "=================================================="
            echo "1. EPOLL THREAD IMPLEMENTATION"
            echo "=================================================="

            grep -RInE -B 25 -A 75 \
              'startEpollThread|epoll_wait|pthread_create|nativeAllocate' \
              "$WINLATOR" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "2. VIRGL CONNECTION JNI"
            echo "=================================================="

            grep -RInE -B 25 -A 75 \
              'handleNewConnection|handleRequest|destroyClient|virgl_server_client' \
              "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "3. VIRGL RENDERER INITIALIZATION"
            echo "=================================================="

            grep -RInE -B 30 -A 90 \
              'virgl_server_renderer_init|virgl_server_egl_init|vrend_renderer_init' \
              "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "4. GLOBAL EGL CONTEXT ASSIGNMENT"
            echo "=================================================="

            grep -RInE -B 25 -A 50 \
              'globalEGLContext|setGlobalEGLContext|eglGetCurrentContext' \
              "$WINLATOR" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "5. EGL ERROR HANDLING"
            echo "=================================================="

            grep -RniE -B 8 -A 15 \
              'eglGetError|EGL_BAD_CONTEXT|EGL_BAD_MATCH|EGL_BAD_DISPLAY|EGL_NO_CONTEXT|eglCreateContext' \
              "$WINLATOR" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "6. THREAD AND SYNCHRONIZATION PRIMITIVES"
            echo "=================================================="

            grep -RniE \
              'pthread_mutex|pthread_cond|pthread_join|pthread_create|atomic_|stdatomic|__atomic|volatile|semaphore|CountDownLatch|synchronized' \
              "$WINLATOR" "$VIRGL" \
              2>/dev/null || true

            echo
            echo "=================================================="
            echo "7. RELEVANT NATIVE SOURCE FILES"
            echo "=================================================="

            find "$WINLATOR" "$VIRGL" -type f \
              \( -name '*epoll*' \
              -o -name '*connector*' \
              -o -name '*virgl_server*' \
              -o -name 'gpu_helper.c' \) \
              -print | sort

            echo
            echo "=== END OF NATIVE AUDIT ==="

          } > "$OUT"

          echo "Generated: $OUT"
          echo "Report lines: $(wc -l < "$OUT")"
          head -n 150 "$OUT"

      # --------------------------------------------------
      # 14. SUMMARY
      # --------------------------------------------------

      - name: Generate runtime audit summary
        if: always()
        shell: bash
        run: |
          mkdir -p build/runtime-audit

          {
            echo "=== VIRGL ARM32 RUNTIME AUDIT ==="
            echo "Target ABI: armeabi-v7a"
            echo "Android API: 26"
            echo "NDK: 27.2.12479018"

            echo
            echo "=== LIBRARIES ==="

            find build/virgl-arm32-integrated \
              -type f -name '*.so' 2>/dev/null || true

            echo
            echo "=== AUDIT FILES ==="

            find build/runtime-audit \
              -type f 2>/dev/null | sort

          } | tee build/runtime-audit/summary.txt

      # --------------------------------------------------
      # 15. UPLOAD ARTIFACT
      # --------------------------------------------------

      - name: Upload runtime audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virgl-arm32-run
